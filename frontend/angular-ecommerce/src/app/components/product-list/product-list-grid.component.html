<!-- Div fixe en haut pendant le défilement -->
<div class="sticky top-0 z-10 bg-white shadow-md p-4">
  <h4>Category: {{currentCategoryName}}</h4>
</div>

<!-- Contenu de la page avec produits -->
<div class="max-w-8xl mx-auto grid grid-cols-5 mb-5">
  <div class="grid lg:grid-cols-1 gap-6 ml-4 mr-4 mb-10" *ngFor="let tempProduct of products">
    <!-- Produit 1 -->
    <div class="bg-white shadow-md rounded-lg dark:bg-gray- 900 dark:border-gray-700">
      <a routerLink="/products/{{tempProduct.id}}">
        <img class="rounded-t-lg  w-full h-80 object-cover" src="{{tempProduct.imageUrl}}" alt="product image">
      </a>
      <div class="px-5 pb-1">
        <div class="flex items-center mt-2.5 mb-5">
          <!-- Ratings -->
          <svg class="w-5 h-5 text-yellow-300" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
          </svg>
          <span class="bg-blue-100 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded dark:bg-blue-200 dark:text-blue-800 ml-3">5.0</span>
        </div>
         <a routerLink="/products/{{tempProduct.id}}">
        <P>{{ tempProduct.name }}</P>
        </a>
        <div class="flex items-center justify-between">
          <span class="text-2xl font-bold text-gray-800 dark:text-white">{{tempProduct.unitPrice | currency:'USD'}}</span>
        </div>
        <div class="flex items-center justify-between">
          <button (click)="addToCart(tempProduct)" href="#" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Add</button>
        </div>
      </div>

    </div>
    <!-- Répétez pour chaque produit -->

  </div>
      

</div>
 <!-- begin footer -->
            <div class="footer-pagination">
                <div class="row">
                    <div class="col-md-6"></div>

                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-9" style="padding-left: 30%">
                            
                                <ngb-pagination [(page)]="thePageNumber"
                                                [pageSize]="thepageSize"
                                                [collectionSize]="theTotalElements"
                                                [maxSize]="5"
                                                [boundaryLinks]="true"
                                                (pageChange)="listProducts()">

                                </ngb-pagination>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- end footer -->
            <div class="col-md-3" style="text-align: right;">
            <span class="mr-2">Page Size </span>
            <select #myPageSelect (change)="updatePageSize(myPageSelect.value)">
             <option >2</option>
            <option selected="true">5</option>
            <option >10</option>
            <option >20</option>
            <option >50</option>
            </select>
            </div>
